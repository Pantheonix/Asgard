repositories:
  - name: dapr
    url: https://dapr.github.io/helm-charts/

releases:
  - name: dapr
    namespace: asgard
    chart: dapr/dapr
    version: 1.14
    wait: true
    values:
      - global:
          installCRDs: true

  - name: dapr-dashboard
    namespace: asgard
    chart: dapr/dapr-dashboard
    wait: true
    needs:
      - dapr

  - name: asgard-local
    namespace: asgard
    chart: ./asgard-chart/
    needs:
      - dapr