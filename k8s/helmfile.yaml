repositories:
  - name: dapr
    url: https://dapr.github.io/helm-charts/
  - name: bitnami
    url: https://charts.bitnami.com/bitnami

releases:
  - name: dapr
    namespace: asgard
    chart: dapr/dapr
    version: 1.14
    wait: true
    values:
      - global:
          installCRDs: true

  - name: dapr-dashboard
    namespace: asgard
    chart: dapr/dapr-dashboard
    wait: true
    needs:
      - dapr

  - name: redis
    namespace: asgard
    chart: bitnami/redis
    version: 20.2.1
    wait: true
    values:
      - global:
          redis:
            password: a8iuw23iuizy
      - master:
          persistence:
            enabled: false

  - name: postgresql
    namespace: asgard
    chart: bitnami/postgresql
    version: 16.1.2
    wait: true
    values:
      - auth:
          postgresqlUsername: judgemaster
          postgresqlPassword: uaeyjbzuyq
          postgresqlDatabase: judge

  - name: asgard-local
    namespace: asgard
    chart: ./asgard-chart/
    needs:
      - dapr