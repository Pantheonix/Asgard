apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.microservices.anubis.name }}-db-svc
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
    service: {{ .Values.microservices.anubis.name }}-db
spec:
  selector:
    app: {{ .Chart.Name }}
    service: {{ .Values.microservices.anubis.name }}-db
  ports:
    - port: 5433

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.microservices.anubis.name }}-db
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
    service: {{ .Values.microservices.anubis.name }}-db
spec:
  serviceName: {{ .Values.microservices.anubis.name }}-db-svc
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      service: {{ .Values.microservices.anubis.name }}-db
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        service: {{ .Values.microservices.anubis.name }}-db
    spec:
      containers:
        - name: {{ .Values.microservices.anubis.name }}-db
          image: postgres:14.1
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.microservices.anubis.name }}-db-cm
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.microservices.anubis.name }}-db-cm
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.microservices.anubis.name }}-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: {{ .Values.microservices.anubis.name }}-db-pvc
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: {{ .Values.microservices.anubis.name }}-db-pvc
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.microservices.anubis.name }}-db-pv
  namespace: {{ .Values.namespace }}
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  gcePersistentDisk:
    pdName: {{ .Values.microservices.anubis.name }}-db-pv-disk
    fsType: ext4

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.microservices.anubis.name }}-db-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: ""
  volumeName: {{ .Values.microservices.anubis.name }}-db-pv

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.microservices.anubis.name }}-db-cm
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
    service: {{ .Values.microservices.anubis.name }}-db
data:
  POSTGRES_DB: {{ .Values.microservices.anubis.envs.POSTGRES_DB | quote }}
  POSTGRES_USER: {{ .Values.microservices.anubis.envs.POSTGRES_USER | quote }}

---

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.microservices.anubis.name }}-db-secret
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
    service: {{ .Values.microservices.anubis.name }}-db
data:
  POSTGRES_PASSWORD: {{ .Values.microservices.anubis.envs.POSTGRES_PASSWORD | b64enc }}
