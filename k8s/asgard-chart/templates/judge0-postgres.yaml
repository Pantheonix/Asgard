apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.microservices.judge0.name }}-db-svc
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
    service: {{ .Values.microservices.judge0.name }}-db
spec:
  selector:
    app: {{ .Chart.Name }}
    service: {{ .Values.microservices.judge0.name }}-db
  ports:
    - port: 5432
      targetPort: postgres

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.microservices.judge0.name }}-db
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
    service: {{ .Values.microservices.judge0.name }}-db
spec:
  serviceName: {{ .Values.microservices.judge0.name }}-db-svc
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      service: {{ .Values.microservices.judge0.name }}-db
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        service: {{ .Values.microservices.judge0.name }}-db
    spec:
      containers:
        - name: {{ .Values.microservices.judge0.name }}-db
          image: postgres:14.1
          ports:
            - name: postgres
              containerPort: 5432
          # TODO: use configmap/secret for envs
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.postgresqlDatabase }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.postgresqlDatabase }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.postgresqlPassword }}
          volumeMounts:
            - name: {{ .Values.microservices.judge0.name }}-db-pvc
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: {{ .Values.microservices.judge0.name }}-db-pvc
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Values.microservices.judge0.name }}-db-pv
  namespace: {{ .Values.namespace }}
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  gcePersistentDisk:
    pdName: {{ .Values.microservices.judge0.name }}-db-pv-disk
    fsType: ext4

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.microservices.judge0.name }}-db-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ""
  volumeName: {{ .Values.microservices.judge0.name }}-db-pv
