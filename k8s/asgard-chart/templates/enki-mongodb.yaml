apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.microservices.enki.name }}-db-secret
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  password: {{ .Values.microservices.enki.envs.MONGO_INITDB_ROOT_PASSWORD | b64enc }}

---

apiVersion: opstreelabs.in/v1alpha1
kind: MongoDBCluster
metadata:
  name: {{ .Values.microservices.enki.name }}-db
  namespace: {{ .Values.namespace }}
spec:
  clusterSize: 1
  kubernetesConfig:
    image: quay.io/opstree/mongo:v5.0
    imagePullPolicy: IfNotPresent
    securityContext:
      fsGroup: 1001
  storage:
    accessModes: [ "ReadWriteOnce" ]
    storageSize: 1Gi
  mongoDBSecurity:
    mongoDBAdminUser: {{ .Values.microservices.enki.envs.MONGO_INITDB_ROOT_USERNAME }}
    secretRef:
      name: {{ .Values.microservices.enki.name }}-db-secret
      key: password
  mongoDBMonitoring:
    enableExporter: true
    image: bitnami/mongodb-exporter:0.11.2-debian-10-r382
    imagePullPolicy: IfNotPresent