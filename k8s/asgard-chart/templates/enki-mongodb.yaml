{{/*kind: Secret*/}}
{{/*metadata:*/}}
{{/*  name: mongodb-secret*/}}
{{/*immutable: false*/}}
{{/*type: Opaque*/}}
{{/*data:*/}}
{{/*  password: password_for_mongodb*/}}
