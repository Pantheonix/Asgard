                  - name: envoy.filters.http.router
          tls_context:
            common_tls_context:
              tls_certificates:
                - certificate_chain:
                    filename: "/etc/ssl/certs/https.crt"
                  private_key:
                    filename: "/etc/ssl/certs/key.pem"
  clusters:
    - name: dapr
      connect_timeout: 0.25s
      type: strict_dns
      lb_policy: round_robin
      hosts:
      - socket_address:
          address: 127.0.0.1
          port_value: ${DAPR_SIDECAR_PORT}
